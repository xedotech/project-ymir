[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ymir"
version = "0.1.0"
description = "Ymir Labs Phase I harness: compute-accounted evaluation and adaptive-compute (Gravitas-lite) experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
data = ["datasets>=2.18"]
plot = ["matplotlib>=3.7"]
mathverify = ["math-verify>=0.5"]
dev = ["pytest>=7"]

[project.scripts]
ymir = "ymir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
